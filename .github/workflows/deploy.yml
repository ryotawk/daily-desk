name: ニュース取得とページ公開

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # 30分ごと（GitHubの都合で10〜30分遅れることがあります）
  workflow_dispatch:

permissions:
  contents: write   # 月1回の生存コミット用
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: ニュースを取得
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 scripts/fetch_news.py site/news.json
          else
            python3 scripts/fetch_news.py site/news.json --allow-empty
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      # 公開リポジトリは60日間更新がないと定期実行が自動停止するため、30日ごとに空コミットを入れる
      - name: 月1回の生存コミット
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi

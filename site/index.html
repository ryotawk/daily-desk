<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Daily Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="board">
  <header class="top">
    <div class="date"><span class="date-md" id="date-md"></span><span class="date-wd" id="date-wd"></span></div>
    <div class="clock" id="clock"></div>
  </header>

  <section class="schedule wx-main">
    <div id="weather" class="weather"></div>
    <p id="weather-note" class="weather-note"></p>
    <div id="news" class="news"></div>
  </section>

  <section class="side">
    <div id="month" class="month"></div>
  </section>

  <section class="hourly">
    <button type="button" id="prev" class="nav" aria-label="4時間前へ">◀</button>
    <div id="hours" class="hours"></div>
    <button type="button" id="next" class="nav" aria-label="4時間先へ">▶</button>
  </section>

  <footer id="status" class="status">
    <span id="status-text" class="status-text"></span>
    <button type="button" id="open-settings" class="status-btn">設定</button>
  </footer>
</main>

<div id="settings" class="sheet" hidden>
  <div class="sheet-inner">
    <h2>設定</h2>
    <label class="row">天気の地域
      <select id="s-place"></select>
    </label>
    <div class="row two" id="s-custom">
      <label>緯度 <input id="s-lat" type="number" step="0.0001"></label>
      <label>経度 <input id="s-lon" type="number" step="0.0001"></label>
    </div>
    <label class="row">残像クリア（黒→白の切り替え）
      <select id="s-ghost">
        <option value="0">しない</option>
        <option value="1">毎時0分</option>
        <option value="3">3時間ごと（0分）</option>
      </select>
    </label>
    <div class="row buttons">
      <button type="button" id="s-refresh">今すぐ更新</button>
      <button type="button" id="s-flash">今すぐ残像クリア</button>
    </div>
    <div class="row buttons">
      <button type="button" id="s-save" class="primary">保存して閉じる</button>
      <button type="button" id="s-cancel">閉じる</button>
    </div>
    <p class="sheet-note" id="s-info"></p>
  </div>
</div>
<div id="flash" class="flash" hidden></div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
